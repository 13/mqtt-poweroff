name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          ignore_paths: tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats jq openssl
      - name: Run tests
        run: bats tests

  systemd-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify unit file
        run: |
          sudo install -m 755 mqtt-poweroff.sh /usr/local/bin/mqtt-poweroff.sh
          systemd-analyze verify ./mqtt-poweroff.service
          systemd-analyze security --offline=yes --threshold=3 ./mqtt-poweroff.service
